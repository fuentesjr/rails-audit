plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-minitest

AllCops:
  NewCops: disable
  # Config ownership (--config) bypasses the target's own AllCops: Exclude
  # entirely, not just its plugins/require list (DESIGN.md §9). This list
  # is deliberately minimal: this project's whole premise is no silent
  # false negatives, so we exclude ONLY generated/non-application files
  # that are never hand-edited for quality. db/migrate/** is real,
  # hand-written code that can carry real findings and is intentionally
  # NOT excluded here — only the generated db/schema.rb is.
  #
  # Patterns are prefixed with '**/' rather than written relative-to-root
  # (e.g. 'bin/**/*'). RuboCop resolves relative Exclude entries relative
  # to the directory of the config file that defines them — here, this
  # gem's own config/rails_audit/, not the target app being scanned, which
  # always lives elsewhere on disk. Verified empirically: unprefixed
  # entries silently matched nothing against a real target and let
  # db/schema.rb's offenses through uncaught — exactly the kind of silent
  # false negative this list exists to prevent.
  Exclude:
    - '**/db/schema.rb'
    - '**/bin/**/*'
    - '**/vendor/**/*'
    - '**/node_modules/**/*'
    - '**/tmp/**/*'

Rails/AddColumnIndex:
  Enabled: true

Rails/DangerousColumnNames:
  Enabled: true

Rails/MigrationClassName:
  Enabled: true

Rails/ThreeStateBooleanColumn:
  Enabled: true

# rubocop-minitest 0.40.0 ships only 18 of its 56 cops as Enabled: true (those fire
# without any override here — NewCops: disable only affects `pending` cops); 35 are
# `pending` and would stay dark otherwise — the same silent-false-negative shape as the
# Rails schema/migration cops above. The pending set was triaged (DESIGN.md §8): the
# three correctness-shaped cops below are enabled explicitly rather than letting "no
# findings" read as "tests are fine"; the rest stay dark as style-tier or unevaluated
# (deferred list in the §8 adoption record).
Minitest/UnreachableAssertion:
  Enabled: true

Minitest/SkipEnsure:
  Enabled: true

Minitest/UselessAssertion:
  Enabled: true

RailsAudit/FatModel:
  Enabled: true
  MaxLines: 200
  MaxPublicMethods: 15

RailsAudit/FatControllerAction:
  Enabled: true
  MaxLines: 15

RailsAudit/TimeoutModuleUse:
  Enabled: true

RailsAudit/NetHttpDefaultTimeouts:
  Enabled: true

RailsAudit/NetHttpMissingTimeout:
  Enabled: true

RailsAudit/FaradayMissingTimeout:
  Enabled: true

RailsAudit/HttpartyMissingTimeout:
  Enabled: true

RailsAudit/RackTimeoutDisabled:
  Enabled: true
